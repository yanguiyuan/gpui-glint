name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo doc --no-deps --all-features --locked

  msrv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - run: cargo check --lib --all-features --locked

  windows-plugin-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Exercise the executable entry point: unit tests use larger thread stacks
      # and cannot catch Windows main-thread stack overflow during Boa startup.
      - run: cargo build -p glint-api --locked
      - run: cargo test -p glint-api plugins:: --locked -- --ignored
        env:
          GLINT_API_TEST_EXECUTABLE: ${{ github.workspace }}\target\debug\glint-api.exe
