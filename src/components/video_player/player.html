<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src http: https: glintvideo:; img-src data:">
<style>
:root{color-scheme:dark;--accent:#3a9cff;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f6f8;background:#101318}
*{box-sizing:border-box}body{margin:0;overflow:hidden}#player{height:100vh;display:flex;flex-direction:column;outline:none}#stage{position:relative;flex:1;min-height:0;background:#080a0e;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}#status{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;pointer-events:none;color:#a4aab5;text-align:center;padding:24px;background:#101318}#status:empty{display:none}#status svg{width:40px;height:40px;opacity:.6}#status strong{font-size:15px;font-weight:500;color:#dce0e6}#status span{font-size:12px;line-height:1.6;max-width:440px}#center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}#center button{pointer-events:auto;background:#101318b8;border:1px solid #ffffff35;backdrop-filter:blur(12px);width:58px;height:58px;border-radius:50%;padding:17px}#center[hidden]{display:none}#controls{flex-shrink:0;padding:12px 16px 14px;background:#171b22;border-top:1px solid #ffffff0d}#timeline{width:100%;margin:0 0 10px;height:4px;display:block}#bar{display:flex;align-items:center;gap:10px;min-width:0}button,select{font:inherit;color:inherit;border:0;background:transparent;border-radius:6px}button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}button:hover,select:hover{background:#ffffff13}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled,input:disabled{opacity:.35;cursor:default}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#clock{white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums;color:#b8bfca}#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#a4acb8;font-size:11px;text-align:center;padding:0 8px}#volume{width:70px;margin:0}select{padding:5px 6px;font-size:11px;cursor:pointer}input[type=range]{accent-color:var(--accent);cursor:pointer}#timeline{appearance:none;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--progress,0%),#ffffff26 var(--progress,0%))}#timeline::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:#fff}#timeline::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff}#volume{height:4px}#bar .separator{width:1px;height:16px;background:#ffffff18;margin:0 2px}#player:fullscreen{background:#080a0e}#player:fullscreen #stage{flex:1}@media(max-width:520px){#title,#volume,#bar .separator{display:none}#bar{gap:5px}#clock{flex:1}#controls{padding:10px 12px}}
</style></head><body>
<div id="player" tabindex="0" role="region" aria-label="视频播放器">
<div id="stage"><video id="video" playsinline preload="metadata" tabindex="-1"></video><div id="status" role="status"></div><div id="center" hidden><button id="centerPlay" aria-label="播放视频"></button></div></div>
<div id="controls"><input id="timeline" type="range" min="0" max="1" step="0.05" value="0" aria-label="播放进度" disabled>
<div id="bar"><button id="play" aria-label="播放" disabled></button><span id="clock">00:00 / 00:00</span><span id="title"></span><button id="mute" aria-label="静音"></button><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量"><span class="separator"></span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="fullscreen" aria-label="全屏"></button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), player=$('player');let video=$('video');
const icons={play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',volume:'<path d="M11 5 6 9H3v6h3l5 4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',mute:'<path d="M11 5 6 9H3v6h3l5 4ZM16 9l5 6M21 9l-5 6"/>',fullscreen:'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>',video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
let generation=0, source=null, desiredPlaying=false, scrubbing=false, visible=true, pendingSeek=null;
const finite=value=>Number.isFinite(value)?Math.max(0,value):0;
const duration=()=>finite(video.duration), position=()=>finite(video.currentTime);
const emit=(kind,extra={})=>window.ipc.postMessage(JSON.stringify({kind,generation,position:position(),duration:duration(),playing:!video.paused&&!video.ended,ended:video.ended,volume:video.volume,muted:video.muted,rate:video.playbackRate,...extra}));
function time(seconds){seconds=Math.floor(finite(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return(h?h+':':'')+(h?String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');}
function status(title,detail){const el=$('status');el.replaceChildren();if(!title)return;el.innerHTML=icon('video');const heading=document.createElement('strong');heading.textContent=title;el.appendChild(heading);if(detail){const text=document.createElement('span');text.textContent=detail;el.appendChild(text);}}
function update(){const active=!!source;$('play').disabled=!active;$('play').innerHTML=icon(video.paused?'play':'pause');$('play').ariaLabel=video.paused?'播放':'暂停';$('mute').innerHTML=icon(video.muted||video.volume===0?'mute':'volume');$('mute').ariaLabel=video.muted?'取消静音':'静音';$('volume').value=video.muted?0:video.volume;if(!Array.from($('speed').options).some(option=>option.value===String(video.playbackRate))){let option=$('customRate');if(!option){option=new Option();option.id='customRate';$('speed').add(option);}option.value=String(video.playbackRate);option.text=video.playbackRate+'×';}$('speed').value=String(video.playbackRate);const length=duration();$('timeline').disabled=!length;$('timeline').max=length||1;if(!scrubbing)$('timeline').value=position();const current=scrubbing?Number($('timeline').value):position();$('timeline').style.setProperty('--progress',(length?current/length*100:0)+'%');$('clock').textContent=time(current)+' / '+(Number.isFinite(video.duration)?time(length):(active&&video.readyState?'直播':'00:00'));$('center').hidden=!active||!video.paused||video.readyState<2||!!video.error;}
async function play(){desiredPlaying=true;if(!source||!visible)return;const current=video,token=generation;try{await current.play();}catch(error){if(current!==video||token!==generation)return;desiredPlaying=false;update();if(error.name!=='AbortError')emit('error',{message:error.name==='NotAllowedError'?'请点击播放按钮开始播放':error.message});}}
function pause(){desiredPlaying=false;video.pause();update();}
function seek(value){if(duration()){video.currentTime=Math.min(duration(),Math.max(0,value));pendingSeek=null;}else pendingSeek=value;update();}
function toggle(){if(video.paused)play();else pause();}
$('play').onclick=toggle;$('centerPlay').innerHTML=icon('play');$('centerPlay').onclick=toggle;
$('stage').onclick=event=>{if(event.target===video)toggle();};
$('mute').onclick=()=>{video.muted=!video.muted;};$('volume').oninput=()=>{video.volume=Number($('volume').value);video.muted=video.volume===0;};$('speed').onchange=()=>{video.playbackRate=Number($('speed').value);};
$('timeline').oninput=()=>{scrubbing=true;update();};$('timeline').onchange=()=>{seek(Number($('timeline').value));scrubbing=false;update();};$('timeline').onblur=()=>{if(scrubbing){scrubbing=false;update();}};
$('fullscreen').innerHTML=icon('fullscreen');$('fullscreen').onclick=()=>emit('fullscreen');
player.onkeydown=event=>{if(event.target.matches('input,select,button'))return;if([' ','k','ArrowLeft','ArrowRight','m','f'].includes(event.key)){event.preventDefault();if(event.key===' '||event.key==='k')toggle();if(event.key==='ArrowLeft')seek(position()-5);if(event.key==='ArrowRight')seek(position()+5);if(event.key==='m')video.muted=!video.muted;if(event.key==='f')emit('fullscreen');}};
window.glintVideo={
load(config){pause();video.removeAttribute('src');video.load();generation=config.generation;source=config.source;const next=document.createElement('video');next.id='video';next.playsInline=true;next.preload='metadata';next.tabIndex=-1;video.replaceWith(next);video=next;bindVideo(video,generation);pendingSeek=config.position||null;$('title').textContent=config.title||'';document.documentElement.style.setProperty('--accent',config.accent);video.volume=config.volume;video.muted=config.muted;video.defaultPlaybackRate=config.rate;video.playbackRate=config.rate;video.loop=config.looped;visible=config.visible;if(!source){status('选择一个视频','支持本地文件与网络视频');update();return;}status('正在载入视频…','');video.src=source;video.load();if(config.playing&&visible)play();update();},
command(config){switch(config.action){case 'title':$('title').textContent=config.value;break;case 'play':play();break;case 'pause':pause();break;case 'seek':seek(config.value);break;case 'volume':video.volume=config.value;break;case 'mute':video.muted=config.value;break;case 'rate':video.playbackRate=config.value;break;case 'loop':video.loop=config.value;break;case 'visible':visible=config.value;if(!visible)pause();break;case 'accent':document.documentElement.style.setProperty('--accent',config.value);break;}update();}
};
function bindVideo(element,token){const on=(name,handler)=>element.addEventListener(name,event=>{if(element===video&&token===generation)handler(event);});
on('loadedmetadata',()=>{status('','');if(pendingSeek!==null)seek(pendingSeek);update();emit('loaded',{width:video.videoWidth,height:video.videoHeight});});
on('canplay',()=>{status('','');update();});on('waiting',()=>{if(source)status('正在缓冲…','');});on('playing',()=>status('',''));
for(const event of ['play','pause','volumechange','ratechange','seeked'])on(event,()=>{update();emit('state');});
on('timeupdate',()=>{update();emit('progress');});on('durationchange',update);
on('ended',()=>{desiredPlaying=false;update();emit('ended');});
on('error',()=>{if(!source)return;desiredPlaying=false;const messages={1:'视频加载已取消',2:'视频读取失败，请检查文件或网络连接',3:'视频解码失败，文件可能已损坏',4:'系统不支持该视频格式或编码'};const message=messages[video.error?.code]||'无法播放视频';status('无法播放',message);$('center').hidden=true;update();emit('error',{message});});
}
bindVideo(video,0);
window.addEventListener('pagehide',pause);status('选择一个视频','支持本地文件与网络视频');update();emit('ready');
</script></body></html>
