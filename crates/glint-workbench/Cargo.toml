[package]
name = "glint-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A unified Glint API and Agent desktop workspace."
license = "MIT"
publish = false

[features]
default = ["webview"]
webview = ["glint-api/webview"]

[dependencies]
glint-vault = { path = "../glint-vault" }
glint-api = { path = "../glint-api", default-features = false }
glint-agent = { path = "../glint-agent" }
gpui-glint = { path = "../.." }
async-channel = "2"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { package = "gpui-ce", version = "=0.2.2", features = ["test-support"] }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["test-support"] }
