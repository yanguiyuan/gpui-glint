[package]
name = "glint-plugin-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
[dependencies]
glint-plugin-registry = { path = "../glint-plugin-registry" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
futures-util = "0.3"
ed25519-dalek = "2"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
