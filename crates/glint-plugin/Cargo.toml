[package]
name = "glint-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Application-independent plugin contracts and JavaScript execution for Glint hosts."
license = "MIT"
[features]
default = ["boa"]
boa = ["dep:boa_engine", "dep:boa_gc", "dep:hmac"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
boa_engine = { version = "=0.22.0", default-features = false, optional = true }
boa_gc = { version = "=0.22.0", optional = true }
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
[dev-dependencies]
tempfile = "3"

[[example]]
name = "database_page"
required-features = ["boa"]
