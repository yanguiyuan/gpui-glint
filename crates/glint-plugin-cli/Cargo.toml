[package]
name = "glint-plugin-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
[[bin]]
name = "glint-pluginctl"
path = "src/main.rs"
[dependencies]
glint-plugin = { path = "../glint-plugin", default-features = false }
glint-plugin-registry = { path = "../glint-plugin-registry" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

semver = "1"
