[package]
name = "glint-vault"
version = "0.1.0"
default-run = "glint-vault"
edition = "2024"
rust-version = "1.95"
description = "An encrypted local vault with an embeddable native Glint page."
license = "MIT"
publish = false

[dependencies]
gpui-glint = { path = "../.." }
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "wayland", "x11"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-ce", version = "=0.2.2", features = ["test-support"] }
