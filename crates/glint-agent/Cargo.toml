[package]
name = "glint-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native agent conversation workspace built with Glint and GPUI-CE."
license = "MIT"
publish = false

[dependencies]
glint-vault = { path = "../glint-vault" }
gpui-glint = { path = "../.." }
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "wayland", "x11"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "process", "io-util"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
async-channel = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
httpdate = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "ico", "pnm"] }
rusqlite = { version = "0.38", features = ["bundled"] }
jieba-rs = "0.11.0"
strsim = "0.11"
serde_yaml_ng = "0.10"
ignore = "0.4"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[dev-dependencies]
gpui = { package = "gpui-ce", version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
